__include__:
  - ../../configs/rtdetrv2/rtdetrv2_dinov3b_visdrone.yml

output_dir: ./output/experiments/dinov3_full_finetune

DINOv3Backbone:
  freeze_backbone: False

optimizer:
  type: AdamW
  params:
    -
      params: ^(?=.*backbone\.dinov3)(?!.*norm).*$
      lr: 0.00001
    -
      params: ^(?=.*(?:backbone\.adapter|encoder|decoder))(?=.*(?:norm|bn)).*$
      weight_decay: 0.
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001