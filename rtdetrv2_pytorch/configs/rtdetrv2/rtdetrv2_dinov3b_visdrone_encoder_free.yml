__include__: [
  '../dataset/visdrone.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/rtdetrv2_r50vd.yml',
]


output_dir: ./output/rtdetrv2_dinov3b_visdrone_encoder_free


RTDETR:
  backbone: DINOv3Backbone
  encoder: PassThroughEncoder
  decoder: RTDETRTransformerv2


DINOv3Backbone:
  model_name: dinov3_vitb16
  pretrained_path: /home/fj/dinov3/weights/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
  layers_to_use: 4
  freeze_backbone: True
  hidden_dim: 256


PassThroughEncoder:
  in_channels: [256, 256, 256, 256]
  feat_strides: [4, 8, 16, 32]
  strict_shape: True


RTDETRTransformerv2:
  feat_channels: [256, 256, 256, 256]
  feat_strides: [4, 8, 16, 32]
  num_levels: 4
  num_layers: 3
  num_points: [4, 4, 4, 4]


epoches: 120

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm).*$'
      lr: 0.00001
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001


train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 117
  collate_fn:
    scales: ~